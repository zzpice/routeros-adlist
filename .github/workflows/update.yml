name: Update RouterOS adlist

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: update-adlist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest -v
  update:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build RouterOS adlist
        run: python convert.py

      - name: Commit changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- adlist.txt)" ]]; then
            echo "adlist.txt is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adlist.txt
          git commit -m "chore: update adlist"
          git push
